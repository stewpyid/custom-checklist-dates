<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">

    <title>Authorize</title>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <style>
        body {
            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                sans-serif;

            padding: 16px;
            color: #172b4d;
        }

        button {
            width: 100%;
            padding: 10px;

            border: none;
            border-radius: 3px;

            background: #0c66e4;
            color: white;

            font-size: 14px;
            font-weight: 600;

            cursor: pointer;
        }

        button:hover {
            background: #0055cc;
        }
    </style>
</head>

<body>

<button id="authorize">
    Authorize Checklist Dates
</button>

<script>

const APP_KEY = '366dbe929f3398a21e20a250d3fa4c17';

const t = TrelloPowerUp.iframe();

document
    .getElementById('authorize')
    .addEventListener('click', function () {

        const returnUrl =
            window.location.origin +
            window.location.pathname;

        const authUrl =
            'https://trello.com/1/authorize' +
            '?expiration=never' +
            '&scope=read' +
            '&name=Checklist%20Date%20Ranges' +
            '&key=' +
            encodeURIComponent(APP_KEY) +
            '&callback_method=fragment' +
            '&return_url=' +
            encodeURIComponent(returnUrl);

        t.authorize(authUrl, {
            width: 500,
            height: 600
        })
        .then(function () {

            return t.closePopup();

        });

    });

</script>

</body>
</html>
