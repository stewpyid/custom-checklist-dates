<!DOCTYPE html>
<html lang="en">
<head>

    <meta charset="UTF-8">

    <title>Checklist Date Ranges</title>

    <script src="https://p.trellocdn.com/power-up.min.js"></script>

    <style>

        body {

            margin: 0;

            padding: 8px;

            background: transparent;

            font-family:
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                Roboto,
                Helvetica,
                Arial,
                sans-serif;

            color: #172b4d;
        }


        #checklist-container {

            display: flex;

            flex-direction: column;

            gap: 10px;
        }


        .checklist-section {

            margin-bottom: 6px;
        }


        .checklist-title {

            font-size: 14px;

            font-weight: 600;

            margin-bottom: 6px;

            color: #172b4d;
        }


        .task-row {

            display: flex;

            align-items: center;

            gap: 8px;

            padding: 8px;

            margin-bottom: 4px;

            background: #f4f5f7;

            border-radius: 3px;
        }


        .task-name {

            flex: 1;

            min-width: 0;

            font-size: 13px;

            color: #172b4d;

            white-space: nowrap;

            overflow: hidden;

            text-overflow: ellipsis;
        }


        .date-inputs {

            display: flex;

            align-items: center;

            gap: 4px;

            flex-shrink: 0;
        }


        .date-label {

            font-size: 10px;

            color: #5e6c84;

            font-weight: 600;
        }


        .date-input {

            width: 120px;

            padding: 4px;

            border: 1px solid #dfe1e6;

            border-radius: 3px;

            background: white;

            font-size: 12px;
        }


        .empty-message {

            color: #5e6c84;

            font-size: 13px;

            padding: 10px 0;
        }


        .error-message {

            color: #c9372c;

            font-size: 13px;

            padding: 10px;
        }


        .loading-message {

            color: #5e6c84;

            font-size: 13px;

            padding: 10px 0;
        }

    </style>

</head>

<body>

    <div id="checklist-container">

        <div class="loading-message">

            Loading checklist items...

        </div>

    </div>


    <script src="./checklist-dates.js"></script>

</body>
</html>
