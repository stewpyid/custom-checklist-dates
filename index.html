<!DOCTYPE html>
<html>
  <head>
    <meta charset="utf-8">
    <title>Checklist Date Range Power-Up</title>
    <link rel="stylesheet" href="https://trellocdn.com">
    <!-- Load the Trello library first -->
    <script src="https://trellocdn.com"></script>
    <style>
      body { padding: 5px; background-color: transparent; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; }
      #checklist-container { display: flex; flex-direction: column; gap: 6px; }
      .task-row { display: flex; align-items: center; justify-content: space-between; background: #22272b; padding: 8px 12px; border-radius: 3px; border: 1px solid #38414a; }
      .task-name { flex-grow: 1; font-weight: 400; font-size: 14px; color: #b6c2cf; max-width: 45%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
      .date-inputs { display: flex; gap: 8px; align-items: center; }
      .date-inputs label { font-size: 11px; color: #9fadbc; text-transform: uppercase; font-weight: 600; }
      input[type="date"] { background: #2c333a; border: 1px solid #454f59; padding: 4px 6px; border-radius: 3px; font-size: 13px; color: #b6c2cf; color-scheme: dark; }
    </style>
  </head>
  <body>
    <div id="checklist-container">
      <p style="color: #9fadbc; font-style: italic; padding: 10px;">Loading checklist date settings...</p>
    </div>
    <!-- Load the initialization logic second -->
    <script src="./client.js"></script>
  </body>
</html>
